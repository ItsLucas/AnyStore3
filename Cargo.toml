[workspace]
resolver = "3"
members = [
    "crates/anystore-domain",
    "crates/anystore-metastore",
    "crates/anystore-blobstore",
    "crates/anystore-metastore-postgres",
    "crates/anystore-application",
    "crates/anystore-http",
    "crates/anystore-blobstore-local",
    "crates/anystore-blobstore-cos",
    "crates/anystore-server",
    "crates/anystore-testkit",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
anystore-domain = { path = "crates/anystore-domain" }
anystore-metastore = { path = "crates/anystore-metastore" }
anystore-blobstore = { path = "crates/anystore-blobstore" }
anystore-application = { path = "crates/anystore-application" }
anystore-http = { path = "crates/anystore-http" }
anystore-metastore-postgres = { path = "crates/anystore-metastore-postgres" }
anystore-blobstore-cos = { path = "crates/anystore-blobstore-cos" }
anystore-blobstore-local = { path = "crates/anystore-blobstore-local" }
anystore-testkit = { path = "crates/anystore-testkit" }

async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
hex = "0.4"
hmac = "0.12"
http = "1"
percent-encoding = "2"
quick-xml = "0.42"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "rustls-native-certs", "webpki-roots", "http2", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "macros",
    "tls-rustls-ring",
    "postgres",
    "chrono",
    "json",
    "migrate",
] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "fs", "io-util"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "limit", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ulid = "3"
